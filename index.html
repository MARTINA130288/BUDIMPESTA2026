<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>*{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Budimpešta advent 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: jedna kolona za mobitel, ljepljivo zaglavlje s izborom obitelji, donja traka s četiri kartice; vremena kao vozni red, žuta kao budimpeštanski tramvaj */
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --ink: #15233B; --muted: #5A6476; --line: #DAE0E8;
  --tram: #F2C200; --tram-ink: #2E2500;
  --kids: #0B7369; --kids-bg: #DFF2EF;
  --fak: #A2500A; --fak-bg: #FBEAD8;
  --rez: #2C4A7A; --rez-bg: #E3EAF6;
  --heart: #C2334D;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1421; --surface: #162033; --ink: #E7EBF2; --muted: #9AA4B7; --line: #283449;
  --tram: #F2C200; --tram-ink: #241D00;
  --kids: #63CFC3; --kids-bg: #10302D; --fak: #F2A866; --fak-bg: #3A2512;
  --rez: #A9C1EE; --rez-bg: #1D2B47; --heart: #F27A90; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1421; --surface: #162033; --ink: #E7EBF2; --muted: #9AA4B7; --line: #283449;
  --tram: #F2C200; --tram-ink: #241D00;
  --kids: #63CFC3; --kids-bg: #10302D; --fak: #F2A866; --fak-bg: #3A2512;
  --rez: #A9C1EE; --rez-bg: #1D2B47; --heart: #F27A90; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
a { color: inherit; }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--tram); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
header.top .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
header.top h1 { font-family: var(--f-display); font-weight: 800; font-size: 18px; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.linija { background: var(--tram); color: var(--tram-ink); font-size: 12px; font-weight: 800; border-radius: 4px; padding: 1px 6px; letter-spacing: 0.02em; }
header.top label { font-size: 12px; opacity: .8; margin-right: 6px; }
header.top select { background: var(--surface); color: var(--ink); border: 0; border-radius: 8px; padding: 6px 8px; font-weight: 600; max-width: 60vw; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); }
main > section { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 18px; margin: 0; text-wrap: balance; }
.mut { color: var(--muted); }
.mali { font-size: 13px; }
.oznaka-sekcije { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.blok { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kv { display: grid; grid-template-columns: minmax(84px, max-content) 1fr; gap: 4px 12px; margin: 0; }
.kv dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.hero { display: flex; flex-direction: column; gap: 6px; padding-block: 4px 4px; }
.odbrojavanje { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 2px; }
.sat > div { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 2px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.sat b { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 10vw, 44px); line-height: 1; font-variant-numeric: tabular-nums; }
.sat span { font-size: 12px; opacity: .8; }
.sat > .sek { background: var(--tram); color: var(--tram-ink); }
.odbrojavanje b { font-family: var(--f-display); font-weight: 800; font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.rok { background: var(--tram); color: var(--tram-ink); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.rok b { font-family: var(--f-display); font-size: 17px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 10px 14px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; }
.btn.glavni { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rok .btn { align-self: flex-start; background: var(--tram-ink); color: var(--tram); border: 0; }
.redak { display: flex; gap: 8px; flex-wrap: wrap; }

/* Plan */
.dani { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.dan-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.dan-btn small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.dan-btn[aria-pressed="true"] { background: var(--tram); color: var(--tram-ink); border-color: var(--tram); }
.dan-btn[aria-pressed="true"] small { color: var(--tram-ink); }
.filteri { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vozni-red { display: flex; flex-direction: column; gap: 0; }
.stavka { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.stavka:first-child { border-top: 0; }
.vrijeme { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; line-height: 1.3; padding-top: 2px; overflow-wrap: anywhere; }
.vrijeme.prazno { color: var(--muted); font-weight: 400; }
.sadrzaj { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.naslov-red { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }
.naslov-red h3 { font-size: 16px; }
.gdje { font-size: 13px; color: var(--muted); }
.gdje a { color: var(--muted); }
.nap { font-size: 14px; }
.znacke { display: flex; gap: 6px; flex-wrap: wrap; }
.zn { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; }
.zn.djeca { background: var(--kids-bg); color: var(--kids); }
.zn.fak { background: var(--fak-bg); color: var(--fak); }
.zn.rez { background: var(--rez-bg); color: var(--rez); }
.srce { border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 4px; color: var(--muted); flex: none; }
.srce[aria-pressed="true"] { color: var(--heart); }
.blok.zagreb { border: 2px solid var(--tram); }
.prijedlog { display: flex; flex-direction: column; gap: 2px; background: var(--fak-bg); color: var(--ink); border-left: 4px solid var(--fak); border-radius: 8px; padding: 10px 12px; }
.prijedlog b { color: var(--fak); }
.iznos { display: flex; flex-direction: column; gap: 2px; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.iznos b { font-family: var(--f-display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.izbor.dva { grid-template-columns: 1fr 1fr; }
.izbor.dva button { font-size: 14px; padding: 10px 6px; }
.park { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.park ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.srce .broj { font-size: 12px; font-weight: 600; margin-left: 2px; vertical-align: middle; }
details.blok summary { cursor: pointer; font-weight: 600; }
.cijena { font-size: 13px; color: var(--fak); }
.akt-link { font-size: 13px; font-weight: 600; align-self: flex-start; }
.izbor { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.izbor button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 2px; font-size: 12.5px; cursor: pointer; line-height: 1.2; }
.izbor button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.glasovi { font-size: 13px; color: var(--muted); }
.savjet { border-left: 3px solid var(--tram); padding: 4px 0 4px 12px; font-size: 14px; }
.prazno-stanje { color: var(--muted); padding: 16px 0; }

/* Podsjetnik */
.napredak { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.napredak { display: flex; }
.napredak i { display: block; height: 100%; background: var(--kids); width: 0; transition: width .3s; }
.napredak i.ceka-traka { background: var(--fak); opacity: .55; }
.zadaci { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.zadaci li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.zadaci li:first-child { border-top: 0; }
.zadaci input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--kids); }
.zadaci label { cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.zadaci li.gotovo label > span:first-child { text-decoration: line-through; color: var(--muted); }
.zadaci .dok { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; padding-top: 2px; }
.zadaci .info { font-size: 13px; color: var(--muted); }

/* Kod obitelji i stanje slanja (Google tablica) */
.kodtraka { max-width: 640px; margin: 0 auto 16px; }
.kodtraka:empty { display: none; }
.odabir-obitelji { background: var(--tram); color: var(--tram-ink); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--tram) 35%, transparent); }
.odabir-obitelji > b { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.2; }
.obitelji-gumbi { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-top: 4px; }
.obitelji-gumbi button { background: var(--tram-ink); color: var(--tram); border: 0; border-radius: 10px; padding: 12px 6px; font-weight: 800; font-size: 16px; letter-spacing: .03em; cursor: pointer; }
header.top select.istakni { background: var(--tram); color: var(--tram-ink); outline: 3px solid var(--tram); outline-offset: 2px; animation: puls 1.6s ease-in-out infinite; }
@keyframes puls { 50% { outline-color: transparent; } }
.kod-unos { display: flex; gap: 8px; flex-wrap: wrap; }
.kod-unos input { font-weight: 600; letter-spacing: .15em; text-transform: uppercase; width: 9em; border: 0; border-radius: 10px; padding: 9px 12px; background: var(--surface); color: var(--ink); }
.stanje-slanja { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stanje-slanja.greska { color: var(--fak); font-weight: 600; }
.stanje-slanja .btn { padding: 4px 10px; font-size: 13px; }

/* Kutak za djecu */
.kutak { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; color: #fff; position: relative; overflow: hidden;
  background: radial-gradient(circle at 88% 12%, rgba(255,255,255,.25) 0 18px, transparent 19px),
              radial-gradient(circle at 8% 92%, rgba(255,255,255,.18) 0 26px, transparent 27px),
              linear-gradient(135deg, #6C4DF6 0%, #C247C9 55%, #FF7A59 100%); }
.kutak-vrh { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.kutak-vrh h3 { font-weight: 800; font-size: 20px; color: #fff; }
.kutak-zn { background: #FFD93D; color: #3A2A00; font-weight: 800; font-size: 13px; border-radius: 999px; padding: 3px 10px; transform: rotate(-3deg); }
.kutak-kartica { background: #fff; color: #23164D; border-radius: 14px; padding: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; box-shadow: 0 6px 0 rgba(0,0,0,.12); }
.kutak-kartica p { margin: 0; font-size: 16px; line-height: 1.45; font-weight: 500; }
.kutak-ik { font-size: 44px; line-height: 1; grid-row: span 2; }
.kutak-br { font-size: 12px; font-weight: 700; color: #8B7BC8; }
.kutak-kartica.skok { animation: skok .35s ease-out; }
@keyframes skok { 0% { transform: scale(.94) rotate(-1deg); opacity: .4; } 100% { transform: none; opacity: 1; } }
.kutak-dno { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tocke { display: flex; gap: 5px; }
.tocke i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.45); }
.tocke i.on { background: #FFD93D; transform: scale(1.3); }
.kutak-btn { background: #FFD93D; color: #3A2A00; border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.kutak-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.18); }

.mjesta-vrh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.mjesta { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 10px; overscroll-behavior-x: contain; }
.mjesto { flex: 0 0 78%; max-width: 290px; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.mjesto-slika { position: relative; aspect-ratio: 16 / 10; display: grid; place-items: center; background: linear-gradient(135deg, #6C4DF6, #C247C9 55%, #FF7A59); }
.mjesto-slika img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mjesto-veliki { font-size: 64px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
.mjesto-ik { position: absolute; left: 8px; top: 8px; font-size: 22px; background: rgba(255,255,255,.92); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; }
.mjesto-slika .foto { position: absolute; right: 6px; bottom: 6px; font-size: 10px; color: #fff; background: rgba(0,0,0,.45); border-radius: 4px; padding: 1px 5px; text-decoration: none; }
.mjesto-tijelo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.mjesto-tijelo h4 { margin: 0; font-family: var(--f-display); font-size: 17px; }
.mjesto-tijelo p { margin: 0; font-size: 14px; flex: 1; }
.mjesto-gumbi { display: flex; gap: 6px; flex-wrap: wrap; }
.mjesto-gumbi a { font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 10px; }
/* Dječji način */
body.zakljucano nav.tabovi, body.zakljucano #mismo, body.zakljucano .kodtraka { display: none !important; }
.dj-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 8px 8px 14px; font-size: 14px; font-weight: 600; }
.dj-bar .btn { padding: 6px 12px; font-size: 13px; background: var(--bg); color: var(--ink); border: 0; }
.dj-forma { display: flex; flex-direction: column; gap: 6px; }
.dj-roditelji summary { font-size: 14px; }
.dj-roditelji .kod-unos input { background: var(--bg); border: 1px solid var(--line); }
.kutak.kviz { background: radial-gradient(circle at 90% 85%, rgba(255,255,255,.2) 0 22px, transparent 23px),
  radial-gradient(circle at 6% 10%, rgba(255,255,255,.18) 0 16px, transparent 17px),
  linear-gradient(135deg, #0F9D8A 0%, #2F7BE5 60%, #6C4DF6 100%); }
.kv-odgovori { display: flex; flex-direction: column; gap: 8px; }
.kv-odg { background: rgba(255,255,255,.95); color: #23164D; border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 16px; text-align: left; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
.kv-odg:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
.kv-odg:disabled { cursor: default; }
.kv-odg.tocno { background: #2BB673; color: #fff; }
.kv-odg.krivo { background: #F0506E; color: #fff; }
.kv-odg.sivo { opacity: .55; }
.kv-obj { background: rgba(255,255,255,.95); color: #23164D; border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.45; border-left: 6px solid #2BB673; }
.kv-obj.ne { border-left-color: #F0506E; }
.kutak-kartica.kraj p { font-size: 17px; }

/* Javi se */
.sazetak { white-space: pre-wrap; font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-wrap: anywhere; }
textarea { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); resize: vertical; }

.hrana { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.hrana li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.hrana span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.hrana .eur { color: var(--ink); font-weight: 600; }

nav.tabovi { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabovi .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabovi a { text-decoration: none; text-align: center; padding: 10px 2px 12px; font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; font-weight: 500; color: var(--muted); border-top: 3px solid transparent; }
nav.tabovi a[aria-current="page"] { color: var(--ink); border-top-color: var(--tram); font-weight: 600; }
nav.tabovi a .ik { display: block; font-size: 18px; line-height: 1.2; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; z-index: 7; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1><span class="linija">BP</span> Budimpešta advent</h1>
  <div id="mismo"><label for="obitelj">Mi smo</label><select id="obitelj"></select></div>
</div></header>

<main>
  <div class="kodtraka" id="kodtraka" aria-live="polite"></div>
  <section id="v-pregled"></section>
  <section id="v-plan" hidden></section>
  <section id="v-djeca" hidden></section>
  <section id="v-podsjetnik" hidden></section>
  <section id="v-javi" hidden></section>
</main>

<nav class="tabovi" aria-label="Kartice"><div class="in">
  <a href="#pregled" data-v="pregled"><span class="ik" aria-hidden="true">⌂</span>Pregled</a>
  <a href="#plan" data-v="plan"><span class="ik" aria-hidden="true">☰</span>Plan</a>
  <a href="#djeca" data-v="djeca"><span class="ik" aria-hidden="true">🎈</span>Kutak za djecu</a>
  <a href="#podsjetnik" data-v="podsjetnik"><span class="ik" aria-hidden="true">✓</span>Podsjetnik</a>
  <a href="#javi" data-v="javi"><span class="ik" aria-hidden="true">✉</span>Javi se</a>
</div></nav>

 390 HUF."}, {"id": "odjeca", "rok": "10.12.", "za": "svi", "tekst": "Kape, rukavice, topla i udobna obuća", "nap": "Puno smo vani, a rukavice trebaju i za klizanje."}], "kviz": [{"ik": "🌊", "p": "Koja velika rijeka teče kroz Budimpeštu?", "o": ["Sava", "Dunav", "Drava"], "t": 1, "obj": "Dunav dijeli grad na Budim (brda i dvorac) i Peštu (ravnica). U subotu se po njemu vozimo brodom."}, {"ik": "💰", "p": "Kojim se novcem plaća u Mađarskoj?", "o": ["Forinta", "Euro", "Kuna"], "t": 0, "obj": "Mađarska ima svoj novac, forintu (HUF). Za 1 euro dobije se oko 390 forinti."}, {"ik": "🦁", "p": "Koliko kamenih lavova čuva Lančani most?", "o": ["2", "4", "8"], "t": 1, "obj": "Četiri – po dva na svakom kraju mosta. Potražite ih u subotu!"}, {"ik": "🏰", "p": "Koliko kula ima Ribarska utvrda?", "o": ["3", "7", "12"], "t": 1, "obj": "Sedam kula – za sedam mađarskih plemena koja su davno došla u ovaj kraj."}, {"ik": "🦅", "p": "Kako se zove mitska ptica iz mađarskih legendi?", "o": ["Feniks", "Roda", "Turul"], "t": 2, "obj": "Turul. Njezin veliki kip s raširenim krilima stoji kod Budimskog dvorca."}, {"ik": "🧩", "p": "Koja je poznata igračka izmišljena u Budimpešti?", "o": ["Lego kocke", "Rubikova kocka", "Jo-jo"], "t": 1, "obj": "Rubikovu kocku izumio je Ernő Rubik 1974. Lego je iz Danske."}, {"ik": "🏛️", "p": "Koja je najveća zgrada u Mađarskoj, na obali Dunava?", "o": ["Parlament", "Bazilika", "Opera"], "t": 0, "obj": "Parlament. Navečer je osvijetljen, a s broda se najljepše vidi."}, {"ik": "🚇", "p": "Od kada vozi najstariji budimpeštanski metro, linija M1?", "o": ["1896.", "1960.", "2004."], "t": 0, "obj": "Od 1896. – to je najstarija podzemna željeznica na europskom kontinentu."}, {"ik": "🍩", "p": "Kako se zove kolač koji se peče namotan na valjak iznad žara?", "o": ["Lángos", "Kürtőskalács", "Palačinka"], "t": 1, "obj": "Kürtőskalács (kurtoškalač) – iznutra je šupalj kao dimnjak. Lángos je prženo tijesto."}, {"ik": "🗣️", "p": "Kako se na mađarskom kaže „hvala”?", "o": ["Danke", "Köszönöm", "Grazie"], "t": 1, "obj": "Köszönöm (čita se: kesenem). A „bok” je szia (čita se: sija)."}, {"ik": "♨️", "p": "Po čemu je Budimpešta posebno poznata?", "o": ["Po toplicama s toplom vodom", "Po plažama na moru", "Po vulkanima"], "t": 0, "obj": "Ispod grada je više od sto izvora tople vode. Najpoznatije kupalište je Széchenyi u Gradskom parku – kupa se vani i zimi!"}, {"ik": "🏝️", "p": "Kako se zove veliki otok-park na Dunavu usred Budimpešte?", "o": ["Krk", "Margitin otok", "Hvar"], "t": 1, "obj": "Margitin otok (Margitsziget) – pun je staza, parkova i ima glazbenu fontanu."}, {"ik": "🗿", "p": "Koliko konjanika – plemenskih vođa – stoji na Trgu heroja?", "o": ["3", "7", "12"], "t": 1, "obj": "Opet sedam! Sedam vođa sedam mađarskih plemena. Trg heroja vidimo u nedjelju."}, {"ik": "🚋", "p": "Koje je boje većina tramvaja u Budimpešti?", "o": ["Plave", "Žute", "Zelene"], "t": 1, "obj": "Žute! Tramvaj broj 2 vozi uz Dunav i često ga ubrajaju među najljepše tramvajske linije u Europi."}, {"ik": "🌶️", "p": "Koji je crveni začin poznat iz Mađarske?", "o": ["Cimet", "Paprika", "Vanilija"], "t": 1, "obj": "Paprika – po njoj je gulaš crven. Na sajmovima se prodaje u lijepim vrećicama."}, {"ik": "🦈", "p": "Koja životinja u Tropicariumu pliva točno iznad glave?", "o": ["Morski pas", "Delfin", "Kit"], "t": 0, "obj": "Morski psi – kroz staklo se ide tunelom ispod akvarija. To vidimo u petak!"}, {"ik": "⛸️", "p": "Što je ljeti na mjestu velikog klizališta u Gradskom parku?", "o": ["Bazen", "Jezero za vožnju čamcem", "Parkiralište"], "t": 1, "obj": "Jezero! Zimi se zaledi u klizalište pred dvorcem Vajdahunyad, a ljeti se po njemu vozi čamcem."}, {"ik": "⛪", "p": "Kako se zove velika crkva ispred koje je adventski sajam i svjetlosna projekcija?", "o": ["Katedrala sv. Duje", "Bazilika sv. Stjepana", "Notre-Dame"], "t": 1, "obj": "Bazilika sv. Stjepana (Szent István). Katedrala sv. Duje je u Splitu, a Notre-Dame u Parizu."}, {"ik": "🌍", "p": "Kroz koliko država teče Dunav?", "o": ["3", "10", "20"], "t": 1, "obj": "Kroz deset država – više nego ijedna rijeka na svijetu! Jedna od njih je i Hrvatska (Vukovar)."}, {"ik": "⚽", "p": "Tko je bio Ferenc Puskás, po kojem se zove najveći stadion u Mađarskoj?", "o": ["Nogometaš", "Pjevač", "Kuhar"], "t": 0, "obj": "Jedan od najboljih nogometaša svih vremena. Po njemu se zove i FIFA-ina nagrada za najljepši gol godine."}, {"ik": "👍", "p": "Što na mađarskom znači „igen”?", "o": ["Ne", "Hvala", "Da"], "t": 2, "obj": "Igen znači da, a nem znači ne. Sad znate odgovoriti Mađarima!"}, {"ik": "🎄", "p": "Na kojem je trgu najpoznatiji adventski sajam u Budimpešti?", "o": ["Trg heroja", "Vörösmarty tér", "Trg bana Jelačića"], "t": 1, "obj": "Vörösmarty tér – tu je oko 150 štandova. Trg bana Jelačića je u Zagrebu."}], "znas_li": [["🌉", "Budim i Pešta bili su dva grada sve do 1873. Lančani most bio je prvi stalni most između njih."], ["🚇", "Metro M1 vozi od 1896. To je najstarija podzemna željeznica na europskom kontinentu."], ["🧩", "Rubikovu kocku izumio je Budimpeštanac Ernő Rubik 1974., a kemijsku olovku Mađar László Bíró."], ["🍩", "Kürtőskalács se peče namotan na drveni valjak iznad žara, pa je iznutra šupalj kao dimnjak."], ["🦅", "Turul je mitska ptica iz mađarskih legendi, a njezin veliki kip čuva Budimski dvorac."], ["🦈", "U Tropicariumu kroz tunel ispod akvarija morski psi plivaju točno iznad glave."], ["🪑", "13. prosinca je Lucijin dan. U Mađarskoj se toga dana počinje izrađivati Lucijin stolac, koji se dovršava do Badnjaka."], ["🦁", "Legenda kaže da je kipar lavova s Lančanog mosta skočio u Dunav kad su mu rekli da lavovi nemaju jezik. Lavovi ipak imaju jezik – samo se odozdo ne vidi."], ["🌉", "Grof István Széchenyi tjedan dana nije mogao prijeći Dunav jer je rijekom plovio led, a mosta nije bilo. Tada je odlučio da grad mora dobiti most – tako je nastao Lančani most."], ["🏰", "Dvorac Vajdahunyad u Gradskom parku najprije je napravljen od drva i kartona, samo za proslavu 1896. Ljudima se toliko svidio da je poslije sagrađen od kamena."], ["♨️", "Ispod Budimpešte je više od sto izvora tople vode. U kupalištu Széchenyi ljudi igraju šah sjedeći u toploj vodi – i zimi, kad pada snijeg!"], ["🗣️", "Mađarski jezik nije sličan hrvatskom. Najbliži rođaci su mu finski i estonski."], ["🎂", "Dobos torta s tvrdim karamelom na vrhu izmišljena je u Budimpešti 1884. Izmislio ju je slastičar József Dobos."], ["🦇", "Ispod Budimpešte ima više od 200 špilja, a ispod Budimskog dvorca je cijeli labirint podzemnih hodnika."], ["🎅", "Mađarska djeca 6. prosinca stave očišćene čizmice na prozor, a Mikulás (sveti Nikola) u njih stavi slatkiše."], ["👑", "U zgradi Parlamenta čuva se mađarska kruna – stara više od 800 godina, s nakrivljenim križem na vrhu."]], "hrana": [["Kürtőskalács (dimnjak-kolač)", "2.800–4.900 HUF", true], ["Lángos (prženo tijesto s vrhnjem i sirom)", "2.200–3.000 HUF", true], ["Gulaš u kruhu", "4.500 HUF", false], ["Pečeni kesteni", "2.500 HUF", true], ["Dječji punč (gyerekpuncs) i vruća čokolada", "na mnogim štandovima", true], ["Kuhano vino (forralt bor)", "1.600 HUF", false]], "skripta": "https://script.google.com/macros/s/AKfycbzwP5yIAHwVM8i5y6IevBOhHFgASOmOKKR21OOKHoXXi79NjK6hRAAMnKrfIX3AwD99/exec", "_skripta": "URL Google Apps Script web aplikacije (tools/google_prijave.gs). Prazno = samo WhatsApp.", "zagreb": {"javiti_do": "29.11.", "otkaz_do": "7.12. u 23:59", "objekt": "CASA V BENCUN, Kriška 1, Zagreb", "nocenje": "čet 10.12. – pet 11.12., 1 noćenje", "cijene": {"smln": "108,00", "nimm": "108,00", "ajk": "96,30", "bp": "89,10", "gkdn": "95,58", "dp": "81,81", "dmtm": "95,58"}, "bez_uplate": ["smln"], "zasto": "Apartmani u Zagrebu rezervirani su za sve obitelji. Besplatno se mogu otkazati samo do 7.12. u 23:59, a od 8.12. naplaćuje se puna cijena. Zato Martina mora na vrijeme znati tko ide preko Zagreba."}, "mjesta_djeca": [{"ik": "🦈", "naziv": "Tropicarium", "kad": "pet", "tekst": "Morski psi plivaju točno iznad glave u staklenom tunelu, a tu su i šarene /* ---------- Plan ---------- */

      ${oz.length ? `<div class="znacke">${oz.map(x => `<span class="zn ${OZN[x][0]}">${OZN[x][1]}</span>`).join("")}</div>` : ""}

/* ---------- Podsjetnik ---------- */
function stavkePodsjetnika() {

    if (z.id === "zagreb_uplata" && o) nap = `Za vašu obitelj ${D.zagreb.cijene[o.id]} € – samo ako idete preko Zagreba.`;
    if (z.id === "zagreb" && izbori.zagreb_nocenje) info = (izbori.zagreb_nocenje === "da" ? "Odabrali ste: idemo preko Zagreba" : "Odabrali ste: ne idemo preko Zagreba") + (S ? "." : " – pošaljite Martini (Javi se).");
    if (z.za === "vozac") {
      info = o && o.vozilo === "kombi" ? "Za kombi ovo rješava vozač kombija." : "Za vozača.";
      if (z.id === "vinjeta" && o) tekst += o.vinjeta === "D2" ? " – kombi, kategorija D2" : " – auto, kategorija D1";
      if (z.id === "parking") {
        if (o && o.parking === "astoria") { nap = `${D.parking.astoria.naziv}, ${D.parking.astoria.adresa}.`; info = o.parking_stanje === "rezervirano" ? "Rezervirano." : "Rezervacija za kombi je u tijeku."; }

}

/* ---------- Javi se ---------- */
/* Sve što obitelj trenutno ima označeno, kao popis stavki za tablicu. Ključ vrsta|stavka. */
function trenutno() {
  const m = {};
  if (izbori.zagreb_nocenje) m["izbor|zagreb_nocenje"] = { vrsta: "izbor", stavka: "zagreb_nocenje", naziv: "Zagreb – noćenje 10.–11.12.", vrijednost: izbori.zagreb_nocenje, opis: izbori.zagreb_nocenje === "da" ? "idemo preko Zagreba" : "ne idemo preko Zagreba" };
  for (const [k, a] of Object.entries(D.aktivnosti)) if (izbori[k]) m["izbor|" + k] = { vrsta: "izbor", stavka: k, naziv: a.naziv + " (" + a.dan + ")", vrijednost: izbori[k], opis: IZBOR_TXT[izbori[k]] };
  for (const d of D.dani) d.stavke.forEach((s, i) => { const k = d.id + i; if (lajkovi.includes(k)) m["lajk|" + k] = { vrsta: "lajk", stavka: k, naziv: s.sto + " (" + d.kratko.toLowerCase() + ")", vrijednost: "1", opis: "sviđa nam se" }; });
  for (const z of stavkePodsjetnika()) if (kvacice[z.id]) m["podsjetnik|" + z.id] = { vrsta: "podsjetnik", stavka: z.id, naziv: z.tekst, vrijednost: "1", opis: "napravili smo" };
  return m;
}
/* Samo ono što se promijenilo od zadnjeg slanja; povučeno se šalje s praznom vrijednošću. */
function promjene() {
  if (!obiteljId) return [];
  const sad = trenutno(), bilo = citaj(kljuc("poslano"), {});
  const out = [];
  for (const [k, v] of Object.entries(sad)) if (!bilo[k] || bilo[k].vrijednost !== v.vrijednost) out.push(v);
  for (const [k, v] of Object.entries(bilo)) if (!sad[k]) out.push({ ...v, vrijednost: "", opis: "povučeno" });
  return out;
}
function poruka() {
  const o = ob(); const L = [];
  L.push(`*Budimpešta advent – ${o ? o.ime : "(obitelj)"}*`);
  if (izbori.zagreb_nocenje) L.push(`*ZAGREB (noćenje 10.–11.12.): ${izbori.zagreb_nocenje === "da" ? "IDEMO preko Zagreba" : "NE idemo preko Zagreba"}*`);
  const po = { svi: [], djeca: [], mozda: [], ne: [] };
  for (const [k, a] of Object.entries(D.aktivnosti)) if (izbori[k]) po[izbori[k]].push(`${a.naziv} (${a.dan})`);
  for (const [v, t] of IZBORI) if (po[v].length) L.push(t + ": " + po[v].join(", "));
  const sv = [];
  for (const d of D.dani) d.stavke.forEach((s, i) => { if (lajkovi.includes(d.id + i)) sv.push(`${s.sto} (${d.kratko.toLowerCase()})`); });
  if (sv.length) L.push("Sviđa nam se: " + sv.join(", "));
  const nap = stavkePodsjetnika().filter(z => !z.potvrdeno && kvacice[z.id]).map(z => z.tekst);
  if (nap.length) L.push("Podsjetnik – napravili smo (molim potvrdu): " + nap.join("; "));
  const p = ($("prijedlog")?.value || citaj(kljuc("prijedlog"), "")).trim();
  if (p) L.push("Prijedlog / pitanje: " + p);
  return L.join("\n");
}

  if (!dod.length && !promjene().length) { toast("Nema ništa novo za poslati"); return; }

}

  }
  $("v-javi").innerHTML = h;
  const ta = $("prijedlog"); ta.value = citaj(kljuc("prijedlog"), "");
  const osvjezi = () => {
    const t = poruka();
    if (S) {
      const pr = promjene(); const p = ta.value.trim();
      const red = pr.map(x => `• ${x.naziv}: ${x.opis}`); if (p) red.push(`• Prijedlog: ${p}`);
      $("sazetak").textContent = red.length ? red.join("\n") : "Sve što ste označili stiglo je Martini.";
    } else $("sazetak").textContent = t;
    $("wa").href = "https://wa.me/?text=" + encodeURIComponent(t);
  };
  ta.oninput = () => { pisi(kljuc("prijedlog"), ta.value); osvjezi(); };
  osvjezi();
  if (S) $("posalji").onclick = posalji;
  $("kopiraj").onclick = () => {
    const t = poruka();
    const sel = () => { const r = document.createRange(); r.selectNodeContents($("sazetak")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Tekst je označen, kopirajte ga"); };
    try { navigator.clipboard.writeText(t).then(() => toast("Kopirano"), sel); } catch (e) { sel(); }
  };
}

/* ---------- Djeca (zasebna kartica od 23.11.: Kutak za djecu i Mali kviz) ---------- */
let znasI = Math.floor(Math.random() * D.znas_li.length);
/* Dječji način (Martina 23.11.): mobitel ostaje na Kutku za djecu dok roditelj ne upiše šifru.
   Šifra se pamti samo na tom mobitelu; kod obitelji također otključava (ako je upisan). */
let djecjiPin = citaj("djecji", "");
function djecjiNacinHtml() {
  if (djecjiPin) return `<div class="dj-bar"><span>🔒 Dječji način – ostale kartice su zaključane</span><button class="btn" id="otkljucaj" type="button">Otključaj</button></div>
    <form class="dj-forma" id="otkl-forma" hidden><label class="mali" for="otkl-pin">Roditelji: upišite šifru${kod ? " ili kod obitelji" : ""}</label>
      <div class="kod-unos"><input id="otkl-pin" type="password" inputmode="${kod ? "text" : "numeric"}" autocomplete="off" maxlength="12" placeholder="šifra"><button class="btn" type="submit">Otključaj</button></div></form>`;
  return `<details class="blok dj-roditelji"><summary>🔒 Za roditelje: dječji način</summary>
    <p class="mali" style="margin:0">Mobitel ostaje na ovoj kartici: dijete ne može otvoriti Pregled, Plan, Podsjetnik ni Javi se ni promijeniti obitelj. Za izlaz treba šifra od 4 broja koju sada odaberete${kod ? " (ili kod obitelji)" : ""}.</p>
    <form class="kod-unos" id="zakl-forma"><input id="zakl-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="šifra, 4 broja" aria-label="Šifra od 4 broja"><button class="btn glavni" type="submit">Zaključaj</button></form>
    <p class="mali mut" style="margin:0">Linkovi na videe i stranice i dalje se otvaraju u pregledniku. Za potpuno zaključavanje mobitela: Android „Prikvačivanje zaslona”, iPhone „Vođeni pristup”.</p></details>`;
}
function djecjiNacinVezi() {
  if ($("zakl-forma")) $("zakl-forma").onsubmit = ev => {
    ev.preventDefault();
    const v = $("zakl-pin").value.trim();
    if (!/^\d{4}$/.test(v)) { toast("Šifra mora imati točno 4 broja"); return; }
    djecjiPin = v; pisi("djecji", v); toast("Dječji način je uključen"); prikazi();
  };
  if ($("otkljucaj")) $("otkljucaj").onclick = () => { $("otkl-forma").hidden = false; $("otkl-pin").focus(); };
  if ($("otkl-forma")) $("otkl-forma").onsubmit = ev => {
    ev.preventDefault();
    const v = $("otkl-pin").value.replace(/\s/g, "");
    if (v === djecjiPin || (kod && v.toUpperCase() === kod)) { djecjiPin = ""; pisi("djecji", ""); toast("Otključano"); prikazi(); }
    else { $("otkl-pin").value = ""; toast("Pogrešna šifra"); }
  };
}
function djeca() {
  let h = djecjiPin ? djecjiNacinHtml() : "";
  h += `<h2>🎈 Kutak za djecu</h2><p class="mut" style="margin:0">Zanimljivosti o Budimpešti, mjesta koja nas zovu (slike i videi) i mali kviz – za put u autu ili večer prije polaska.</p>`;
  if (!djecjiPin) h += djecjiNacinHtml();
  h += `<div class="kutak"><div class="kutak-vrh"><h3>Znaš li?</h3><span class="kutak-zn">💡 ${D.znas_li.length} zanimljivosti</span></div>
    <div class="kutak-kartica" id="znas" aria-live="polite">${zanimljivost(znasI)}</div>
    <div class="kutak-dno"><span class="tocke" aria-hidden="true">${D.znas_li.length <= 10 ? D.znas_li.map((_, k) => `<i${k === znasI ? ' class="on"' : ""}></i>`).join("") : ""}</span><button class="kutak-btn" id="jos">Još jedno ✨</button></div></div>`;
  if (D.mjesta_djeca && D.mjesta_djeca.length) {
    h += `<div class="mjesta-vrh"><h3>📍 Mjesta koja nas zovu</h3><span class="mali mut">povucite lijevo →</span></div>
      <div class="mjesta" role="list">${D.mjesta_djeca.map(m => `<article class="mjesto" role="listitem">
        <div class="mjesto-slika">${m.slika ? `<img src="${esc(m.slika)}" alt="${esc(m.naziv)}" loading="lazy" referrerpolicy="no-referrer"><span class="mjesto-ik" aria-hidden="true">${m.ik}</span>${m.izvor ? `<a class="foto" href="${esc(m.izvor)}" target="_blank" rel="noopener">Foto: Wikimedia</a>` : ""}` : `<span class="mjesto-veliki" aria-hidden="true">${m.ik}</span>`}</div>
        <div class="mjesto-tijelo"><span class="zn djeca" style="align-self:flex-start">${esc(m.kad)}</span><h4>${esc(m.naziv)}</h4><p>${esc(m.tekst)}</p>
          <div class="mjesto-gumbi"><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(m.video || m.naziv + " Budapest")}" target="_blank" rel="noopener">▶ Video</a>${m.link ? `<a href="${esc(m.link)}" target="_blank" rel="noopener">🔗 Stranica</a>` : ""}${m.mapa ? `<a href="${mapa(m.mapa)}" target="_blank" rel="noopener">📍 Karta</a>` : ""}</div></div>
      </article>`).join("")}</div>`;
  }
  if (D.kviz && D.kviz.length) h += `<div class="kutak kviz" id="kviz">${kvizHtml()}</div>`;
  $("v-djeca").innerHTML = h;
  $("jos").onclick = () => {
    znasI = (znasI + 1) % D.znas_li.length;
    const k = $("znas"); k.innerHTML = zanimljivost(znasI); k.classList.remove("skok"); void k.offsetWidth; k.classList.add("skok");
    document.querySelectorAll(".tocke i").forEach((t, n) => t.classList.toggle("on", n === znasI));
  };
  if ($("kviz")) $("kviz").onclick = kvizKlik;
  djecjiNacinVezi();
}

/* ---------- Okvir ---------- */
const VIEWS = { pregled, plan, djeca, podsjetnik, javi };
function prikazi(naVrh = true) {
  const v = (location.hash || "#pregled").slice(1);
  let ime = VIEWS[v] ? v : "pregled";
  // Dječji način: samo Kutak za djecu
  document.body.classList.toggle("zakljucano", !!djecjiPin);
  if (djecjiPin && ime !== "djeca") { history.replaceState(null, "", "#djeca"); ime = "djeca"; naVrh = true; }
  kodTraka();
  if (!naVrh && ime === "javi") return; // ne prekidati pisanje prijedloga
  for (const k of Object.keys(VIEWS)) $("v-" + k).hidden = k !== ime;
  document.querySelectorAll("nav.tabovi a").forEach(a => { if (a.dataset.v === ime) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  VIEWS[ime]();
  if (naVrh) window.scrollTo(0, 0);
}
const sel = $("obitelj");
sel.innerHTML = `<option value="">odaberite…</option>` + D.obitelji.map(o => `<option value="${o.id}">${esc(o.ime)}</option>`).join("");
sel.value = obiteljId;
sel.onchange = () => { obiteljId = sel.value; pisi("obitelj", obiteljId); ucitajObitelj(); prikazi(); sinkroniziraj(); };
ucitajObitelj();
window.addEventListener("hashchange", () => prikazi());
window.addEventListener("online", () => sinkroniziraj());
prikazi();
ucitajServer();
sinkroniziraj();
</script>
</body>
