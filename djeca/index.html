const P = "bpdj26:";   // drukčiji prefiks od roditeljske stranice (isti GitHub poslužitelj dijeli spremište)
function citaj(k, d) { try { const v = localStorage.getItem(P + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function pisi(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
const mapa = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const DANI = { cet: "četvrtak", pet: "petak", sub: "subota", ned: "nedjelja" };

/* Silueta Parlamenta (kao na roditeljskoj stranici) */
const GRAD_SVG = (() => {
  let s = `<svg class="grad" viewBox="0 0 360 64" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><g fill="#7A3E12" opacity=".55">`;
  s += `<rect x="36" y="40" width="288" height="20"/><rect x="60" y="32" width="88" height="10"/><rect x="212" y="32" width="88" height="10"/>`;
  for (let x = 40; x <= 316; x += 12) if (x < 150 || x > 210) s += `<polygon points="${x},40 ${x + 4},31 ${x + 8},40"/>`;
  s += `<rect x="112" y="18" width="12" height="22"/><polygon points="110,18 118,4 126,18"/><rect x="236" y="18" width="12" height="22"/><polygon points="234,18 242,4 250,18"/>`;
  s += `<path d="M150 42 Q150 14 180 12 Q210 14 210 42 Z"/><rect x="176" y="6" width="8" height="8"/><polygon points="174,6 180,0 186,6"/></g>`;
  s += `<g fill="#fff" opacity=".9">`;
  for (let x = 44; x <= 316; x += 10) if (x < 152 || x > 206) s += `<rect x="${x}" y="47" width="3" height="4" rx=".5"/>`;
  s += `</g></svg>`;
  return s;
})();

/* Sat do polaska */
const mn = (n, f) => f[n % 10 === 1 && n % 100 !== 11 ? 0 : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 1 : 2];
function satHtml() {
  const s = Math.max(0, Math.floor((new Date(D.polazak) - new Date()) / 1000));
  const v = [[Math.floor(s / 86400), ["dan", "dana", "dana"]], [Math.floor(s % 86400 / 3600), ["sat", "sata", "sati"]],
    [Math.floor(s % 3600 / 60), ["minuta", "minute", "minuta"]], [s % 60, ["sekunda", "sekunde", "sekundi"]]];
  return v.map(([n, f], i) => `<div${i === 3 ? ' class="sek"' : ""}><b>${i ? String(n).padStart(2, "0") : n}</b><span>${mn(n, f)}</span></div>`).join("");
}
setInterval(() => {
  const el = document.querySelector("[data-sat]"); if (!el) return;
  if (new Date(D.polazak) <= new Date()) { prikazi(false); return; }
  el.innerHTML = satHtml();
}, 1000);

/* ---------- Početna: odbrojavanje i „Znaš li?” ---------- */
let znasI = Math.floor(Math.random() * D.znas_li.length);
function zanimljivost(i) {
  const z = D.znas_li[i], [ik, t] = Array.isArray(z) ? z : ["💡", z];
  return `<span class="kutak-ik" aria-hidden="true">${ik}</span><p>${esc(t)}</p><span class="kutak-br">${i + 1} / ${D.znas_li.length}</span>`;
}
function pocetna() {
  const sad = new Date();
  let h = "";
  if (sad < new Date(D.polazak)) h += `<div class="kutak sat-djeca"><div class="kutak-vrh"><h3>⏰ Još toliko do Budimpešte!</h3><span class="kutak-zn">🚗 čet 10.12. u 16 h</span></div>
    <div class="sat" data-sat role="timer" aria-label="Vrijeme do polaska">${satHtml()}</div>${GRAD_SVG}</div>`;
  else if (sad < new Date(D.povratak)) h += `<div class="kutak sat-djeca"><h3>🚗 Sretan put! Budimpešta nas čeka!</h3>${GRAD_SVG}</div>`;
  else h += `<div class="kutak sat-djeca"><h3>🎄 Bilo je super! Hvala svima!</h3>${GRAD_SVG}</div>`;
  h += `<div class="kutak"><div class="kutak-vrh"><h3>💡 Znaš li?</h3><span class="kutak-zn">${D.znas_li.length} zanimljivosti</span></div>
    <div class="kutak-kartica" id="znas" aria-live="polite">${zanimljivost(znasI)}</div>
    <div class="kutak-dno"><span class="tocke" aria-hidden="true">${D.znas_li.map((_, k) => `<i${k === znasI ? ' class="on"' : ""}></i>`).join("")}</span><button class="kutak-btn" id="jos">Još jedno ✨</button></div></div>`;
  h += `<div class="brzo"><a class="b-mjesta" href="#mjesta"><span aria-hidden="true">📍</span>Mjesta koja nas zovu<small>${D.mjesta_djeca.length} mjesta sa slikama i videima</small></a>
    <a class="b-kviz" href="#kviz"><span aria-hidden="true">🧠</span>Mali kviz<small>Koliko znaš o Budimpešti?</small></a></div>`;
  h += `<p class="napomena">Za put u autu ili večer prije polaska. 🎄</p>`;
  $("v-pocetna").innerHTML = h;
  $("jos").onclick = () => {
    znasI = (znasI + 1) % D.znas_li.length;
    const k = $("znas"); k.innerHTML = zanimljivost(znasI); k.classList.remove("skok"); void k.offsetWidth; k.classList.add("skok");
    document.querySelectorAll(".tocke i").forEach((t, n) => t.classList.toggle("on", n === znasI));
  };
}

/* ---------- Mjesta ---------- */
let danFilter = "sve";
function mjesta() {
  const dani = ["sve", ...Object.keys(DANI).filter(d => D.mjesta_djeca.some(m => m.kad === d))];
  let h = `<h2>📍 Mjesta koja nas zovu</h2><p class="mut" style="margin:0">Pogledaj sliku, pusti video i pronađi mjesto na karti.</p>`;
  if (dani.length > 2) h += `<div class="dani-chip" role="group" aria-label="Dan">${dani.map(d => `<button class="chip" data-dan="${d}" aria-pressed="${danFilter === d}">${d === "sve" ? "Sva mjesta" : DANI[d][0].toUpperCase() + DANI[d].slice(1)}</button>`).join("")}</div>`;
  const popis = D.mjesta_djeca.filter(m => danFilter === "sve" || m.kad === danFilter);
  h += `<div class="mjesta" role="list">${popis.map(m => `<article class="mjesto" role="listitem">
    <div class="mjesto-slika">${m.slika ? `<img src="${esc(m.slika)}" alt="${esc(m.naziv)}" loading="lazy" referrerpolicy="no-referrer"><span class="mjesto-ik" aria-hidden="true">${m.ik}</span>${m.izvor ? `<a class="foto" href="${esc(m.izvor)}" target="_blank" rel="noopener">Foto: Wikimedia</a>` : ""}` : `<span class="mjesto-veliki" aria-hidden="true">${m.ik}</span>`}</div>
    <div class="mjesto-tijelo">${DANI[m.kad] ? `<span class="dan-zn">${esc(DANI[m.kad])}</span>` : m.kad ? `<span class="dan-zn">${esc(m.kad)}</span>` : ""}<h4>${esc(m.naziv)}</h4><p>${esc(m.tekst)}</p>
      <div class="mjesto-gumbi"><a class="video" href="https://www.youtube.com/results?search_query=${encodeURIComponent(m.video || m.naziv + " Budapest")}" target="_blank" rel="noopener">▶ Video</a>${m.link ? `<a href="${esc(m.link)}" target="_blank" rel="noopener">🔗 Stranica</a>` : ""}${m.mapa ? `<a href="${mapa(m.mapa)}" target="_blank" rel="noopener">📍 Karta</a>` : ""}</div></div>
  </article>`).join("")}</div>`;
  $("v-mjesta").innerHTML = h;
  $("v-mjesta").querySelectorAll("[data-dan]").forEach(b => b.onclick = () => { danFilter = b.dataset.dan; mjesta(); });
}

/* ---------- Kviz: svaka igra = KVIZ_N nasumičnih pitanja; rekord se pamti na ovom uređaju ---------- */
const KVIZ_N = Math.min(10, D.kviz.length);
function izmijesaj() {
  const a = D.kviz.map((_, k) => k);
  for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; }
  return a.slice(0, KVIZ_N);
}
const kv = { i: 0, bod: 0, odg: null, red: izmijesaj() };
let rekord = citaj("rekord", 0);
function kvizHtml() {
  const N = kv.red.length;
  const vrh = `<div class="kutak-vrh"><h3>🧠 Mali kviz</h3><span class="kutak-zn">⭐ ${kv.bod} / ${N}</span></div>`;
  if (kv.i >= N) {
    const p = kv.bod === N ? "Svaka čast – sve točno! 🏆" : kv.bod >= N * 0.7 ? "Odlično! Pravi si znalac Budimpešte. 🎉" : kv.bod >= N * 0.4 ? "Dobro je! Na putu ćeš naučiti još. 👍" : "Nema veze – u Budimpešti sve vidiš uživo! 😊";
    return vrh + `<div class="kutak-kartica kraj"><span class="kutak-ik" aria-hidden="true">${kv.bod === N ? "🏆" : "🎉"}</span><p><b>${kv.bod} od ${N} točnih.</b><br>${p}</p></div>
      <div class="kutak-dno"><span class="rekord">🏅 Tvoj rekord: ${rekord} / ${N}</span><button class="kutak-btn" data-kv="opet">Igraj ponovno 🔄</button></div>`;
  }
  const q = D.kviz[kv.red[kv.i]], odg = kv.odg;
  const gumbi = q.o.map((t, k) => {
    const c = odg === null ? "" : k === q.t ? " tocno" : k === odg ? " krivo" : " sivo";
    return `<button class="kv-odg${c}" data-kv="${k}"${odg !== null ? " disabled" : ""}>${esc(t)}${odg !== null && k === q.t ? " ✓" : odg === k && k !== q.t ? " ✗" : ""}</button>`;
  }).join("");
  const obj = odg === null ? "" : `<div class="kv-obj ${odg === q.t ? "da" : "ne"}" aria-live="polite"><b>${odg === q.t ? "Bravo! 🎉" : "Ups! 🙈"}</b> ${esc(q.obj)}</div>`;
  return vrh + `<div class="kutak-kartica"><span class="kutak-ik" aria-hidden="true">${q.ik || "❓"}</span><p>${esc(q.p)}</p><span class="kutak-br">Pitanje ${kv.i + 1} / ${N}</span></div>
    <div class="kv-odgovori">${gumbi}</div>${obj}
    ${odg !== null ? `<div class="kutak-dno"><span></span><button class="kutak-btn" data-kv="dalje">${kv.i + 1 < N ? "Sljedeće pitanje →" : "Rezultat ⭐"}</button></div>` : ""}`;
}
function kvizKlik(ev) {
  const b = ev.target.closest("[data-kv]"); if (!b || b.disabled) return;
  const v = b.dataset.kv;
  if (v === "dalje") { kv.i++; kv.odg = null; if (kv.i >= kv.red.length && kv.bod > rekord) { rekord = kv.bod; pisi("rekord", rekord); } }
  else if (v === "opet") { kv.i = 0; kv.bod = 0; kv.odg = null; kv.red = izmijesaj(); }
  else if (kv.odg === null) { kv.odg = Number(v); if (kv.odg === D.kviz[kv.red[kv.i]].t) kv.bod++; }
  const el = $("kviz"); el.innerHTML = kvizHtml();
  if (v === "dalje" || v === "opet") { const k = el.querySelector(".kutak-kartica"); if (k) k.classList.add("skok"); }
}
function kviz() {
  $("v-kviz").innerHTML = `<h2>🧠 Mali kviz</h2><p class="mut" style="margin:0">${KVIZ_N} pitanja o Budimpešti. Svaka nova igra ima nova pitanja!</p><div class="kutak kviz" id="kviz">${kvizHtml()}</div>`;
  $("kviz").onclick = kvizKlik;
}

/* ---------- Okvir ---------- */
const VIEWS = { pocetna, mjesta, kviz };
function prikazi(naVrh = true) {
  const v = (location.hash || "#pocetna").slice(1);
  const ime = VIEWS[v] ? v : "pocetna";
  for (const k of Object.keys(VIEWS)) $("v-" + k).hidden = k !== ime;
  document.querySelectorAll("nav.tabovi a").forEach(a => { if (a.dataset.v === ime) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (ime !== "kviz" || !$("kviz")) VIEWS[ime]();   // kviz se ne slaže ponovno, da igra ne krene ispočetka
  if (naVrh) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => prikazi());
prikazi();
</script>
